<style>
:root{
  --bg:#1d1b16; --panel:#2a2720; --line:#57513f; --ink:#f0ece0; --muted:#a39d88;
  --hit:#5b6a1c; --hit-hi:#7f922b; --ring:#7aa0e0; --key:#46412f; --key-hi:#5c5640;
  --tile:min(62px, calc((100vw - 64px) / 4));
  font-family: "Rubik", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #38342a}
.brand{font-weight:800;font-size:24px;margin:0}
.mode{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}
.puzzle{text-align:center;font-size:21px;font-weight:800;padding-top:12px}
.status{text-align:center;color:var(--muted);font-size:15px;padding-top:2px}
.board-wrap{flex:1;overflow-y:auto;padding:10px 0 12px}
.board{display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:grid;grid-template-columns:repeat(4,var(--tile));gap:6px}
.tile{width:var(--tile);height:var(--tile);border:2px solid var(--line);border-radius:6px;background:var(--panel);
  display:grid;place-items:center;font-size:calc(var(--tile) * .46);font-weight:700;position:relative;line-height:1;padding-bottom:4%}
.tile.hit{background:var(--hit);border-color:var(--hit-hi)}
.tile.changed::after{content:"";position:absolute;left:22%;right:22%;bottom:5%;height:3px;border-radius:2px;background:var(--ring)}
.row.active .tile{background:transparent}
.row.active .tile.filled{border-color:#8c8570}
.row.active .tile.cursor{border-color:var(--ink)}
.row.active .tile.hinted{border:2px dashed var(--ring)}
.row.ghost .tile{background:transparent;border:2px dashed #3a3629;color:#4d4838}
.row.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.row.win .tile{animation:flip .55s ease both}
.row.win .tile:nth-child(2){animation-delay:.09s}
.row.win .tile:nth-child(3){animation-delay:.18s}
.row.win .tile:nth-child(4){animation-delay:.27s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg);background:var(--hit-hi)}100%{transform:rotateX(0)}}
.puff{position:fixed;left:50%;top:42%;font-size:88px;pointer-events:none;z-index:30;animation:puff 1.3s ease-out forwards}
@keyframes puff{0%{transform:translate(-50%,0) scale(.3);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(calc(-50% - 140px),-60px) scale(1.8);opacity:0}}
.kb{padding:4px 5px;display:flex;flex-direction:column;gap:7px;user-select:none;-webkit-user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:42px;height:54px;border:0;border-radius:6px;background:var(--key);font-size:21px;font-weight:700;touch-action:manipulation;padding:0}
.key.wide{flex:1.6;max-width:72px;font-size:16px}
.key:active{background:var(--key-hi)}
.tools{display:flex;justify-content:space-around;padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
.tools button{background:none;border:0;color:var(--muted);font-size:15px;padding:10px 6px}
.tools button:disabled{opacity:.35;cursor:default}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;
  font-weight:700;font-size:16px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(10,9,6,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.backdrop.open{display:flex}
.modal:focus{outline:none}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:420px;max-height:90dvh;overflow:auto;padding:26px 22px 22px;position:relative}
.modal h2{margin:0 0 8px;font-size:26px;line-height:1.2}
.modal h3{margin:20px 0 8px;font-size:15px;color:var(--muted);font-weight:700}
.modal p{margin:8px 0;line-height:1.5;font-size:16px}
.muted{color:var(--muted)}
.close{position:absolute;top:8px;left:8px;background:none;border:0;font-size:26px;width:40px;height:40px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-weight:700;letter-spacing:.04em;padding:5px 9px;border-radius:6px;background:#3b3729;font-size:17px}
.chip.goal{background:var(--hit)}
.arrow{color:var(--muted);font-size:13px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--hit);font-weight:800;font-size:17px;margin-top:18px}
.btn.secondary{background:#3b3729;margin-top:10px}
.demo{--tile:44px;display:flex;flex-direction:column;align-items:center;gap:5px;margin:14px 0}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:8px}
.stats-grid b{display:block;font-size:30px}
.stats-grid span{font-size:13px;color:var(--muted)}
.hist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.bar{background:#46412f;border-radius:4px;padding:3px 8px;text-align:left;font-weight:800;min-width:26px}
.bar.top{background:var(--hit)}
.countdown{text-align:center;margin-top:14px;color:var(--muted)}
.countdown span{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
textarea.copy{width:100%;height:130px;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.puff{display:none}}
@media (max-height:640px){.key{height:46px}.puzzle{padding-top:6px}}
</style>
</head>

    <button id="t-hint">רמז</button>

    <button id="t-yday">אתמול</button>
    <button id="t-stats">סטטיסטיקה</button>
    <button id="t-help">עזרה</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
    <button class="close" data-act="close" aria-label="סגירה">×</button>
    <div id="modal-body"></div>
  </div>
</div>

const disp = w => w.length === 4 && FINAL_OF[w[3]] ? w.slice(0, 3) + FINAL_OF[w[3]] : w;
const TARGET = 'פלוצ', TARGET_D = disp(TARGET);
const DICT = new Set(unpack(DATA.dict));
const RANK = new Map(unpack(DATA.common).map((w, i) => [w, i]));
const STARTS = unpack(DATA.starts);
const rank = w => RANK.has(w) ? RANK.get(w) : 1e9;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- word graph ----
const keysOf = w => [0, 1, 2, 3].map(i => w.slice(0, i) + '_' + w.slice(i + 1));
const buckets = new Map();
for (const w of DICT) for (const k of keysOf(w)) { let a = buckets.get(k); if (!a) buckets.set(k, a = []); a.push(w); }
const neighbors = w => { const out = []; for (const k of keysOf(w)) for (const n of buckets.get(k) || []) if (n !== w) out.push(n); return out; };
function bfs(allowed) {
  const d = new Map([[TARGET, 0]]), q = [TARGET];
  for (let h = 0; h < q.length; h++) { const w = q[h]; for (const n of neighbors(w)) if (!d.has(n) && allowed(n)) { d.set(n, d.get(w) + 1); q.push(n); } }
  return d;
}
const DIST = bfs(() => true);            // true minimum over the whole dictionary
const isCommon = n => n === TARGET || RANK.has(n);
const CDIST = bfs(isCommon);             // same, common words only
function bestNext(w) {
  const d = DIST.get(w), common = CDIST.get(w) === d; let best = null;
  for (const n of neighbors(w)) {
    if (common ? (!isCommon(n) || CDIST.get(n) !== d - 1) : DIST.get(n) !== d - 1) continue;
    if (!best || rank(n) < rank(best) || (rank(n) === rank(best) && n < best)) best = n;
  }
  return best;
}
function shortestPath(w) { const p = [w]; while (w !== TARGET) { w = bestNext(w); p.push(w); } return p; }
const diffCount = (a, b) => [...a].filter((c, i) => c !== b[i]).length;
const diffPos = (a, b) => [...a].findIndex((c, i) => c !== b[i]);

// ---- days ----
const EPOCH = Date.UTC(2026, 0, 1);
function todayIndex() { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5); }
// Every word appears once per cycle (STARTS.length days) before any repeat. Cycle 0 is the list as shipped;
// later cycles are reshuffled with a fixed seed, and a cycle never opens with the word the previous one ended on.
function mulberry32(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const orders = new Map();
function cycleOrder(c) {
  if (orders.has(c)) return orders.get(c);
  const idx = STARTS.map((_, i) => i);
  if (c !== 0) {
    const r = mulberry32(0x5EED + c * 7919);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    if (c > 0) { const prev = cycleOrder(c - 1); if (idx[0] === prev[prev.length - 1]) [idx[0], idx[1]] = [idx[1], idx[0]]; }
  }
  orders.set(c, idx); return idx;
}
function startFor(day) { const L = STARTS.length, c = Math.floor(day / L); return STARTS[cycleOrder(c)[day - c * L]]; }

// ---- persistence: Claude artifact storage if present, else localStorage, else memory ----
const KEY = 'plotzel:v1';
const backend = (() => {
  if (window.storage && typeof window.storage.get === 'function') return {
    get: async () => { const r = await window.storage.get(KEY, false); return r && r.value; },
    set: async v => { const r = await window.storage.set(KEY, v, false); if (!r) throw new Error('storage.set returned no result'); }
  };
  try {
    const ls = window.localStorage; ls.setItem('__plotzel_test', '1'); ls.removeItem('__plotzel_test');
    return { get: async () => ls.getItem(KEY), set: async v => ls.setItem(KEY, v) };
  } catch (e) { return null; } // private mode / blocked storage
})();
let store = { seenHelp: false, daily: null, stats: { played: 0, solved: 0, streak: 0, best: 0, lastSolved: null, hist: [0, 0, 0, 0, 0] } };
async function load() {
  if (!backend) return;
  try { const v = await backend.get(); if (v) { const s = JSON.parse(v); store = { ...store, ...s, stats: { ...store.stats, ...(s.stats || {}) } }; } } catch (e) { /* first run */ }
}
let storageOk = !!backend, saving = false, queued = false;
async function save() {
  if (!storageOk) return;
  if (saving) { queued = true; return; }
  saving = true;
  try { await backend.set(JSON.stringify(store)); }
  catch (e) { storageOk = false; console.warn('Progress storage unavailable, continuing without saving.', e); }
  saving = false;
  if (queued && storageOk) { queued = false; save(); }
}

// ---- game state ----
let game, typed = '', justWon = false, hintFor = null, hintLevel = 0;
const current = () => game.words[game.words.length - 1];
const par = () => DIST.get(game.start);
const steps = () => game.words.length - 1;
const stepsText = n => n === 1 ? 'צעד אחד' : `${n} צעדים`;
function newGame(mode, start, day) { game = { mode, day, start, words: [start], hints: 0, done: false, gaveUp: false, hintPos: null }; typed = ''; hintFor = null; }
function loadDaily() {
  const day = todayIndex(), s = store.daily;
  if (s && s.day === day && s.words && s.words[0] === startFor(day)) { game = { mode: 'daily', day, start: startFor(day), words: s.words, hints: s.hints, done: s.done, gaveUp: s.gaveUp, hintPos: null }; typed = ''; hintFor = null; }
  else newGame('daily', startFor(day), day);
}
function newPractice() { let w; do { w = STARTS[Math.floor(Math.random() * STARTS.length)]; } while ((game && w === game.start) || w === startFor(todayIndex())); newGame('practice', w, null); }
function persistDaily() { if (game.mode !== 'daily') return; store.daily = { day: game.day, words: game.words, hints: game.hints, done: game.done, gaveUp: game.gaveUp }; save(); }
function finishDaily(solved) {
  if (game.mode !== 'daily') return;
  const st = store.stats; st.played++;
  if (solved) {
    st.solved++; st.streak = st.lastSolved === game.day - 1 ? st.streak + 1 : 1;
    st.best = Math.max(st.best, st.streak); st.lastSolved = game.day;
    st.hist[Math.min(steps() - par(), 4)]++;
  } else st.streak = 0;
}
const liveStreak = () => { const st = store.stats; return st.lastSolved != null && st.lastSolved >= todayIndex() - 1 ? st.streak : 0; };

// ---- actions ----
function press(k) {
  if (isOpen() || game.done) return;
  if (k === 'ENTER') return submit();
  if (k === 'BACK') { typed = typed.slice(0, -1); return render(); }
  k = REGULAR_OF[k] || k;
  if (HEB.includes(k) && typed.length < 4) { typed += k; render(); }
}
function reject(msg) {
  toast(msg);
  const a = document.getElementById('active'); if (!a) return;
  a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
}
function submit() {
  if (typed.length < 4) return reject('צריך 4 אותיות');
  const w = typed, prev = current(), d = diffCount(w, prev);
  if (d === 0) return reject('זו אותה מילה');
  if (d > 1) return reject('משנים רק אות אחת בכל צעד');
  if (!DICT.has(w)) return reject(`${disp(w)} לא נמצאת במילון`);
  if (game.words.includes(w)) return reject(`כבר השתמשתם ב${disp(w)}`);
  game.words.push(w); typed = ''; game.hintPos = null;
  if (w === TARGET) { game.done = true; justWon = true; finishDaily(true); }
  persistDaily(); render();
  if (game.done) { puff(); setTimeout(showResult, reduced ? 50 : 1100); }
}
function hint() {
  if (game.done) return;
  const cur = current(), n = bestNext(cur), pos = diffPos(cur, n);
  if (hintFor !== cur) { hintFor = cur; hintLevel = 0; }
  if (hintLevel < 2) { hintLevel++; game.hints++; }
  game.hintPos = pos;
  toast(hintLevel === 1 ? `החליפו את האות ${['הראשונה', 'השנייה', 'השלישית', 'הרביעית'][pos]}` : `נסו: ${disp(n)}`);
  persistDaily(); render();
}
function confirmGiveUp() {
  if (game.done) return;
  openModal(`<h2>לחשוף את המסלול הקצר ביותר?</h2><p>החידה תסתיים${game.mode === 'daily' ? ' והרצף שלכם יתאפס' : ''}.</p>
    <button class="btn" data-act="reveal">חשיפת המסלול</button><button class="btn secondary" data-act="close">להמשיך לשחק</button>`);
}
function giveUp() { game.done = true; game.gaveUp = true; finishDaily(false); persistDaily(); render(); showResult(); }
function toggleMode() { if (game.mode === 'daily') newPractice(); else loadDaily(); render(); if (game.done) showResult(); }

// ---- sharing ----
function shareText() {
  const RLM = '\u200F';
  const head = game.mode === 'daily' ? `פלוצל #${game.day + 1} 💨` : 'פלוצל, תרגול 💨';
  const h = game.hints ? `, ${game.hints === 1 ? 'רמז אחד' : game.hints + ' רמזים'}` : '';
  const grid = game.words.map(w => RLM + [...w].map((c, i) => c === TARGET[i] ? '🟩' : '⬛').join('')).join('\n');
  const url = /^https?:$/.test(location.protocol) ? '\n' + location.origin + location.pathname : '';
  return `${head}\n${disp(game.start)} ← ${TARGET_D} ב־${stepsText(steps())} (מינימום ${par()}${h})\n${grid}${url}`;
}
async function share() {
  const text = shareText();
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('הועתק ללוח'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  if (ok) return toast('הועתק ללוח');
  const box = document.createElement('textarea'); box.className = 'copy'; box.readOnly = true; box.value = text;
  document.getElementById('modal-body').appendChild(box); box.select(); toast('העתיקו את הטקסט למטה');
}

// ---- modals ----
const backdrop = document.getElementById('backdrop'), body = document.getElementById('modal-body');
let cdTimer, lastFocus;
const isOpen = () => backdrop.classList.contains('open');
function openModal(html) { lastFocus = document.activeElement; clearInterval(cdTimer); body.innerHTML = html; backdrop.classList.add('open'); backdrop.querySelector('.modal').focus({ preventScroll: true }); }
function closeModal() { backdrop.classList.remove('open'); clearInterval(cdTimer); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
const ACTIONS = { close: closeModal, reveal: giveUp, share, another: () => { closeModal(); newPractice(); render(); } };
backdrop.addEventListener('click', e => { if (e.target === backdrop) return closeModal(); const a = e.target.closest('[data-act]'); if (a) ACTIONS[a.dataset.act](); });
const chips = ws => `<div class="chips">${ws.map((w, i) => `${i ? '<span class="arrow" aria-hidden="true">←</span>' : ''}<span class="chip${w === TARGET ? ' goal' : ''}">${disp(w)}</span>`).join('')}</div>`;
const rowHTML = (w, prev) => `<div class="row">${[...disp(w)].map((c, j) => `<div class="tile${w[j] === TARGET[j] ? ' hit' : ''}${prev && prev[j] !== w[j] ? ' changed' : ''}">${c}</div>`).join('')}</div>`;

function showHelp() {
  openModal(`<h2>איך משחקים</h2>
    <p><b>מגיעים מהמילה של היום ל־${TARGET_D} בכמה שפחות צעדים.</b></p>
    <p>בכל צעד משנים אות אחת בדיוק, וכל צעד חייב להיות מילה אמיתית.</p>
    <div class="demo" aria-hidden="true">${rowHTML('חלומ')}${rowHTML('חלוצ', 'חלומ')}</div>
    <p class="muted">הסימון הכחול מראה איזו אות שיניתם. אותיות שכבר נמצאות במקום שלהן ב־${TARGET_D} נצבעות בירוק. אותיות סופיות מסתדרות לבד.</p>
    <p>המינימום הוא המסלול הקצר ביותר האפשרי, ותראו אותו כשתסיימו. מילה חדשה בכל יום בחצות.</p>
    <button class="btn" data-act="close">לשחק</button>`);
}
function showResult() {
  const p = par(), s = steps(), opt = shortestPath(game.start);
  let html;
  if (game.gaveUp) html = `<h2>המסלול הקצר ביותר</h2><p class="muted">מ${disp(game.start)} אפשר להגיע ל־${TARGET_D} ב־${stepsText(p)}.</p>${chips(opt)}`;
  else {
    const over = s - p;
    const title = over === 0 ? 'מושלם, בדיוק במינימום' : over === 1 ? 'צעד אחד מעל המינימום' : `${over} צעדים מעל המינימום`;
    const hintsLine = game.hints ? ` השתמשתם ב${game.hints === 1 ? 'רמז אחד' : '־' + game.hints + ' רמזים'}.` : '';
    html = `<h2>${title}</h2><p class="muted">${stepsText(s)}. המינימום: ${p}.${hintsLine}</p>
      <h3>המסלול שלכם</h3>${chips(game.words)}${over > 0 ? `<h3>מסלול קצר ביותר</h3>${chips(opt)}` : ''}
      <button class="btn" data-act="share">שיתוף התוצאה</button>`;
  }
  html += game.mode === 'daily'
    ? `<div class="countdown">מילה חדשה בעוד <span id="cd"></span></div><button class="btn secondary" data-act="another">תרגול עם מילה אקראית</button>`
    : `<button class="btn secondary" data-act="another">עוד מילה</button>`;
  openModal(html);
  if (game.mode === 'daily') startCountdown();
}
function startCountdown() {
  const tick = () => {
    const el = document.getElementById('cd'); if (!el) return clearInterval(cdTimer);
    const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
    const t = Math.max(0, Math.floor((m - n) / 1000)), pad = x => String(x).padStart(2, '0');
    el.textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`;
    if (t === 0) { clearInterval(cdTimer); closeModal(); loadDaily(); render(); }
  };
  tick(); cdTimer = setInterval(tick, 1000);
}
function showStats() {
  const st = store.stats, max = Math.max(1, ...st.hist), labels = ['מינימום', '+1', '+2', '+3', '+4 ומעלה'];
  const top = st.hist.indexOf(Math.max(...st.hist));
  let html = `<h2>סטטיסטיקה</h2><div class="stats-grid">${[['שוחקו', st.played], ['נפתרו', st.solved], ['רצף', liveStreak()], ['רצף שיא', st.best]]
    .map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
  html += st.solved
    ? `<h3>צעדים מעל המינימום</h3><div class="hist">${st.hist.map((v, i) => `<span><bdi>${labels[i]}</bdi></span><div><div class="bar${i === top && v ? ' top' : ''}" style="width:${Math.max(8, v / max * 100)}%">${v}</div></div>`).join('')}</div>`
    : `<p class="muted" style="margin-top:18px">פתרו חידה יומית כדי להתחיל למלא את הנתונים.</p>`;
  if (!storageOk) html += `<p class="muted">ההתקדמות לא נשמרת כאן, אז הנתונים יתאפסו כשתסגרו את הדף.</p>`;
  openModal(html);
}
function showYesterday() {
  const w = startFor(todayIndex() - 1), p = shortestPath(w);
  openModal(`<h2>המילה של אתמול: ${disp(w)}</h2><p class="muted">המינימום היה ${p.length - 1}.</p><h3>מסלול קצר ביותר</h3>${chips(p)}`);
}

// ---- rendering ----
const $ = id => document.getElementById(id);
const wrap = $('wrap'), board = $('board');
function render() {
  $('puzzle').innerHTML = game.mode === 'daily' ? `<bdi>#${game.day + 1}</bdi>: ${disp(game.start)}` : `תרגול: ${disp(game.start)}`;
  $('mode').textContent = game.mode === 'daily' ? 'תרגול' : 'יומי';
  const s = steps();
  $('status').textContent = game.done ? (game.gaveUp ? 'המסלול נחשף' : `נפתר ב־${stepsText(s)}`) : stepsText(s);
  let h = '';
  game.words.forEach((w, i) => {
    const prev = game.words[i - 1], win = justWon && i === game.words.length - 1, shown = disp(w);
    h += `<div class="row${win ? ' win' : ''}" aria-label="${shown}">` + [...shown].map((c, j) =>
      `<div class="tile${w[j] === TARGET[j] ? ' hit' : ''}${prev && prev[j] !== w[j] ? ' changed' : ''}">${c}</div>`).join('') + '</div>';
  });
  if (!game.done) {
    const shown = disp(typed);
    h += '<div class="row active" id="active" aria-label="המילה הבאה">' + [0, 1, 2, 3].map(j =>
      `<div class="tile${typed[j] ? ' filled' : ''}${j === typed.length ? ' cursor' : ''}${game.hintPos === j ? ' hinted' : ''}">${shown[j] || ''}</div>`).join('') + '</div>';
    h += '<div class="row ghost" aria-hidden="true">' + [...TARGET_D].map(c => `<div class="tile">${c}</div>`).join('') + '</div>';
  }
  board.innerHTML = h; justWon = false;
  $('t-hint').disabled = $('t-giveup').disabled = game.done;
  wrap.scrollTop = wrap.scrollHeight;
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }
function puff() { if (reduced) return; const el = document.createElement('div'); el.className = 'puff'; el.textContent = '💨'; document.body.appendChild(el); setTimeout(() => el.remove(), 1400); }

// ---- keyboard: standard Israeli layout, finals typed or not ----
[['קראטוןםפ', 'BACK'], ['שדגכעיחלךף'], ['זסבהנמצתץ', 'ENTER']].forEach(([letters, extra]) => {
  const row = document.createElement('div'); row.className = 'kb-row';
  const add = (label, k, wide) => { const b = document.createElement('button'); b.className = 'key' + (wide ? ' wide' : ''); b.textContent = label; b.dataset.k = k; row.appendChild(b); return b; };
  for (const ch of letters) add(ch, ch);
  if (extra === 'BACK') add('⌫', 'BACK', true).setAttribute('aria-label', 'מחיקת אות');
  if (extra === 'ENTER') add('אישור', 'ENTER', true);
  $('kb').appendChild(row);
});
$('kb').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
// physical keyboards on an English layout still type Hebrew by key position
const CODE_MAP = { KeyE: 'ק', KeyR: 'ר', KeyT: 'א', KeyY: 'ט', KeyU: 'ו', KeyI: 'ן', KeyO: 'ם', KeyP: 'פ', KeyA: 'ש', KeyS: 'ד', KeyD: 'ג', KeyF: 'כ', KeyG: 'ע', KeyH: 'י', KeyJ: 'ח', KeyK: 'ל', KeyL: 'ך', Semicolon: 'ף', KeyZ: 'ז', KeyX: 'ס', KeyC: 'ב', KeyV: 'ה', KeyB: 'נ', KeyN: 'מ', KeyM: 'צ', Comma: 'ת', Period: 'ץ' };
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isOpen()) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Enter') { e.preventDefault(); press('ENTER'); }
  else if (e.key === 'Backspace') { e.preventDefault(); press('BACK'); }
  else if (/^[\u05d0-\u05ea]$/.test(e.key)) press(e.key);
  else if (CODE_MAP[e.code]) press(CODE_MAP[e.code]);
});
$('t-hint').onclick = hint; $('t-giveup').onclick = confirmGiveUp; $('t-yday').onclick = showYesterday;
$('t-stats').onclick = showStats; $('t-help').onclick = showHelp; $('mode').onclick = toggleMode;
document.addEventListener('visibilitychange', () => { if (!document.hidden && game.mode === 'daily' && game.day !== todayIndex()) { closeModal(); loadDaily(); render(); } });

(async () => {
  loadDaily(); render();
  await load(); loadDaily(); render();
  if (!store.seenHelp) { store.seenHelp = true; save(); showHelp(); }
  else if (game.done) showResult();
})();
</script>
</body>
</html>
