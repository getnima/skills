<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plotzel mock</title>
    <!--
      Stand-in for https://plotzel.netlify.app, for testing the embed slot only.
      Params:  bridge=0  never send bridge messages (a site without the snippet)
               bad=1     also send malformed messages first (they must be ignored)
      The answer is fixed (לימון); the seed is only displayed.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: system-ui, Arial, sans-serif; background: #fffbe9; color: #2b2b2b; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; }
      h1 { margin: 4px 0 0; font-size: 26px; color: #3a8a3a; }
      .seed { font-size: 13px; color: #777; }
      .grid { display: flex; flex-direction: column; gap: 5px; }
      .row { display: flex; gap: 5px; }
      .t { width: 44px; height: 44px; display: grid; place-items: center; font-size: 24px; font-weight: 800; border: 2px solid #ccc; border-radius: 6px; background: #fff; }
      .g { background: #6aaa64; border-color: #6aaa64; color: #fff; }
      .y { background: #c9b458; border-color: #c9b458; color: #fff; }
      .x { background: #787c7e; border-color: #787c7e; color: #fff; }
      .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      button { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 14px; border-radius: 10px; border: 0; background: #3a8a3a; color: #fff; }
      button.alt { background: #8a3a5a; }
      .log { font-size: 12px; color: #555; min-height: 1em; }
    </style>
  </head>
  <body>
    <h1>💨 פלוצל (דמו)</h1>
    <div class="seed" id="seed"></div>
    <div class="grid" id="grid"></div>
    <div class="btns">
      <button id="g1" data-word="שולחן">שולחן</button>
      <button id="g2" data-word="מילון">מילון</button>
      <button id="g3" data-word="לימון">לימון</button>
      <button id="lose" class="alt">להיכשל</button>
    </div>
    <div class="log" id="log"></div>

    <!-- ── the snippet from README.md, verbatim (run below unless ?bridge=0) ── -->
    <script type="text/plain" id="snippet">
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get('embed') !== '1' || window.parent === window) return;
        var target = q.get('parentOrigin') || (document.referrer ? new URL(document.referrer).origin : '');
        if (!/^https?:\/\//.test(target)) return;
        window.plotzelBridge = function (type, data) {
          window.parent.postMessage(Object.assign({ source: 'plotzel', type: type }, data || {}), target);
        };
        window.plotzelBridge('progress', { greens: 0, yellows: 0 });
      })();
    </script>

    <script>
      var q = new URLSearchParams(location.search);
      if (q.get('bridge') !== '0') {
        var run = document.createElement('script');
        run.textContent = document.getElementById('snippet').textContent;
        document.body.appendChild(run);
      }
      var send = function (type, data) {
        if (window.plotzelBridge) window.plotzelBridge(type, data);
        document.getElementById('log').textContent = window.plotzelBridge ? 'sent ' + type + ' ' + JSON.stringify(data) : 'no bridge';
      };
      if (q.get('bad') === '1' && window.plotzelBridge) {
        var t = q.get('parentOrigin');
        window.parent.postMessage({ source: 'plotzel', type: 'solved', tries: 99 }, t); // tries out of range: ignored
        window.parent.postMessage({ source: 'other', type: 'solved', tries: 1 }, t); // wrong source: ignored
        window.parent.postMessage({ source: 'plotzel', type: 'win' }, t); // wrong type: ignored
        window.parent.postMessage('plotzel solved', t); // not an object: ignored
        window.parent.postMessage({ source: 'plotzel', type: 'progress', greens: 4, yellows: 3 }, t); // more than 5 letters: ignored
        window.parent.postMessage({ source: 'plotzel', type: 'solved', score: 1e9 }, t); // score out of range: ignored
      }
      document.getElementById('seed').textContent = 'seed=' + q.get('seed') + ' lang=' + q.get('lang');
      var ANSWER = ['ל', 'י', 'מ', 'ו', 'נ'];
      var norm = function (c) { return { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' }[c] || c; };
      var tries = 0, best = { g: 0, y: 0 }, over = false;
      function score(word) {
        var g = word.map(norm), out = ['x', 'x', 'x', 'x', 'x'], left = {};
        for (var i = 0; i < 5; i++) { if (g[i] === ANSWER[i]) out[i] = 'g'; else left[ANSWER[i]] = (left[ANSWER[i]] || 0) + 1; }
        for (var j = 0; j < 5; j++) { if (out[j] !== 'g' && left[g[j]] > 0) { out[j] = 'y'; left[g[j]]--; } }
        return out;
      }
      function guess(word) {
        if (over) return;
        var letters = Array.from(word), res = score(letters);
        tries++;
        var row = document.createElement('div'); row.className = 'row';
        letters.forEach(function (ch, i) { var d = document.createElement('div'); d.className = 't ' + res[i]; d.textContent = ch; row.appendChild(d); });
        document.getElementById('grid').appendChild(row);
        var g = res.filter(function (r) { return r === 'g'; }).length, y = res.filter(function (r) { return r === 'y'; }).length;
        if (g * 60 + y * 20 > best.g * 60 + best.y * 20) best = { g: g, y: y };
        if (g === 5) { over = true; send('solved', { tries: tries }); return; }
        if (tries >= 6) { over = true; send('failed', { greens: best.g, yellows: best.y }); return; }
        send('progress', { tries: tries, greens: g, yellows: y });
      }
      ['g1', 'g2', 'g3'].forEach(function (id) {
        var b = document.getElementById(id);
        b.addEventListener('click', function () { guess(b.dataset.word); });
      });
      document.getElementById('lose').addEventListener('click', function () {
        while (!over) guess('שולחן');
      });
    </script>
  </body>
</html>
